name: Weekly Documentation Update

on:
  schedule:
    # Run every Sunday at 2:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update Documentation Index
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Full re-index including mappings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Latest Release Tag
        id: get_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "Latest release tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════════════════
      # DOCUMENTATION DATABASE
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Re-index Documentation (Full Rebuild)
        run: |
          # Remove existing database to ensure a fresh index
          rm -f data/docs.db

          # Run full index (no incremental flag)
          pnpm run index-docs -- --sitemap --embeddings
        env:
          # Allow longer timeout and more memory for embedding generation
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Generate Documentation Database Manifest
        run: |
          # Carry the previous manifest forward so --bump sees its version.
          gh release download "$LATEST_TAG" --pattern "docs-manifest.json" --output ./data/docs-manifest.json --clobber || true

          # Generate manifest from the EXACT file we just indexed.
          pnpm run manifest -- --db docs --bump patch --changelog "Weekly update for $LATEST_TAG" --release-tag "$LATEST_TAG" --db-path ./data/docs.db

          # Verify: sha256 of the indexed DB must match what we just wrote into the manifest
          DB_HASH=$(sha256sum ./data/docs.db | cut -d' ' -f1)
          MANIFEST_HASH=$(node -p "require('./data/docs-manifest.json').hash")
          if [ "$DB_HASH" != "$MANIFEST_HASH" ]; then
            echo "ERROR: manifest hash does not match indexed DB: $DB_HASH != $MANIFEST_HASH"
            exit 1
          fi
          echo "Hash verified: $DB_HASH"
        env:
          LATEST_TAG: ${{ steps.get_release.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ═══════════════════════════════════════════════════════════════════════════
      # MAPPINGS DATABASE
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Check Outlands maven availability
        run: |
          # Canary for the 1.12.2 MCP era's primary source. The indexer falls
          # back to the Forge maven's older mcp_config build on its own; this
          # step only makes silent degradation visible in the weekly run.
          MCP_CONFIG_URL="https://maven.outlands.top/releases/de/oceanlabs/mcp/mcp_config/1.12.2-20260220.202731/mcp_config-1.12.2-20260220.202731.zip"
          if curl -sfI --max-time 30 "$MCP_CONFIG_URL" > /dev/null; then
            echo "✅ Outlands maven reachable (mcp_config pinned build present)" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Outlands maven unreachable — 1.12.2 mappings will build from the Forge-maven fallback (older mcp_config build)"
            echo "⚠️ Outlands maven unreachable — mappings built from Forge-maven fallback" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Re-index Mappings (Full Rebuild)
        run: |
          # Remove existing database to ensure a fresh index
          rm -f data/mappings.db

          # Run full mappings index with force flag (1.12.2 MCP era + modern Parchment/Mojang)
          pnpm run index-mappings:force
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Generate Mappings Database Manifest
        run: |
          gh release download "$LATEST_TAG" --pattern "mappings-manifest.json" --output ./data/mappings-manifest.json --clobber || true

          pnpm run manifest -- --db mappings --bump patch --changelog "Weekly mappings update for $LATEST_TAG" --release-tag "$LATEST_TAG" --db-path ./data/mappings.db

          DB_HASH=$(sha256sum ./data/mappings.db | cut -d' ' -f1)
          MANIFEST_HASH=$(node -p "require('./data/mappings-manifest.json').hash")
          if [ "$DB_HASH" != "$MANIFEST_HASH" ]; then
            echo "ERROR: manifest hash does not match indexed DB: $DB_HASH != $MANIFEST_HASH"
            exit 1
          fi
          echo "Hash verified: $DB_HASH"
        env:
          LATEST_TAG: ${{ steps.get_release.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ═══════════════════════════════════════════════════════════════════════════
      # CLEANROOM API DATABASE
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Re-index Cleanroom API (on new Cleanroom tag)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_release.outputs.tag }}
        run: |
          # Canary: is the Cleanroom maven reachable? Unlike the mappings, there
          # is no fallback host — on outage we keep the previous DB untouched.
          META_URL="https://repo.cleanroommc.com/releases/com/cleanroommc/cleanroom/maven-metadata.xml"
          if ! curl -sfI --max-time 30 "$META_URL" > /dev/null; then
            echo "::warning::Cleanroom maven unreachable — keeping the previous cleanroom-api.db"
            echo "⚠️ Cleanroom maven unreachable — cleanroom-api.db not refreshed" >> $GITHUB_STEP_SUMMARY
            echo "CLEANROOM_API_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # Seed with the previously released DB so the indexer's up-to-date
          # check (metadata cleanroom_version + schema_version vs maven latest)
          # can skip no-op rebuilds — a re-upload would bump the manifest and
          # force every client to redownload an identical database.
          gh release download "$TAG" --pattern "cleanroom-api.db" --output data/cleanroom-api.db --clobber || true
          BEFORE=$(sha256sum data/cleanroom-api.db 2>/dev/null | cut -d' ' -f1 || echo none)

          pnpm run index-cleanroom-api

          AFTER=$(sha256sum data/cleanroom-api.db | cut -d' ' -f1)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "CLEANROOM_API_CHANGED=false" >> "$GITHUB_ENV"
            echo "Cleanroom API DB unchanged (same Cleanroom tag and schema) — skipping re-upload"
          else
            echo "CLEANROOM_API_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Generate Cleanroom API Database Manifest
        if: env.CLEANROOM_API_CHANGED == 'true'
        env:
          LATEST_TAG: ${{ steps.get_release.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$LATEST_TAG" --pattern "cleanroom-api-manifest.json" --output ./data/cleanroom-api-manifest.json --clobber || true

          pnpm run manifest -- --db cleanroom-api --bump patch --changelog "Cleanroom API update for $LATEST_TAG" --release-tag "$LATEST_TAG" --db-path ./data/cleanroom-api.db

          DB_HASH=$(sha256sum ./data/cleanroom-api.db | cut -d' ' -f1)
          MANIFEST_HASH=$(node -p "require('./data/cleanroom-api-manifest.json').hash")
          if [ "$DB_HASH" != "$MANIFEST_HASH" ]; then
            echo "ERROR: manifest hash does not match indexed DB: $DB_HASH != $MANIFEST_HASH"
            exit 1
          fi
          echo "Hash verified: $DB_HASH"

      # ═══════════════════════════════════════════════════════════════════════════
      # UPLOAD
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Update Release Assets
        # if: always() so a mappings-indexing failure earlier in the job does
        # not also discard the successfully refreshed docs DB.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_release.outputs.tag }}
        run: |
          if [ -f data/docs.db ] && [ -f data/docs-manifest.json ]; then
            echo "Uploading docs assets to release $TAG..."
            gh release upload "$TAG" data/docs.db data/docs-manifest.json --clobber
          else
            echo "::warning::docs.db or its manifest missing — skipping docs upload"
          fi
          if [ -f data/mappings.db ] && [ -f data/mappings-manifest.json ]; then
            echo "Uploading mappings assets to release $TAG..."
            gh release upload "$TAG" data/mappings.db data/mappings-manifest.json --clobber
          else
            echo "::warning::mappings.db or its manifest missing — skipping mappings upload"
          fi
          if [ "$CLEANROOM_API_CHANGED" = "true" ] && [ -f data/cleanroom-api.db ] && [ -f data/cleanroom-api-manifest.json ]; then
            echo "Uploading Cleanroom API assets to release $TAG..."
            gh release upload "$TAG" data/cleanroom-api.db data/cleanroom-api-manifest.json --clobber
          else
            echo "Cleanroom API assets unchanged or missing — skipping upload"
          fi

      - name: Log summary
        if: always()
        run: |
          echo "## Weekly Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Documentation Database" >> $GITHUB_STEP_SUMMARY
          echo "✅ Full re-index completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mappings Database" >> $GITHUB_STEP_SUMMARY
          echo "✅ Full mappings re-index completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cleanroom API Database" >> $GITHUB_STEP_SUMMARY
          if [ "$CLEANROOM_API_CHANGED" = "true" ]; then
            echo "✅ Re-indexed for a new Cleanroom tag" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Unchanged (same Cleanroom tag) — not re-uploaded" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release" >> $GITHUB_STEP_SUMMARY
          echo "✅ Database assets updated in release ${{ steps.get_release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
