name: Release

on:
  # Triggers on merge/push to prod branch
  push:
    branches: [prod]

  # Triggers when a GitHub Release is published
  release:
    types: [published]

  # Allow manual trigger for emergency releases
  workflow_dispatch:
    inputs:
      skip_npm:
        description: 'Skip npm publish'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prod

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "Computed release tag: $RELEASE_TAG"

      - name: Run validation
        run: pnpm run validate

      - name: Build production
        run: pnpm run build:prod
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Publish to npm
        if: ${{ github.event.inputs.skip_npm != 'true' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "cleanroom-modding-mcp@$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
            echo "⏭️  cleanroom-modding-mcp@$VERSION already published — skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Index and prepare mappings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same heap budget as the weekly job's mappings re-index
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          echo "📋 Indexing mappings (1.12.2 MCP era + modern Parchment/Mojang)..."
          pnpm run index-mappings:force

          # Carry the previous mappings manifest forward so --bump patch climbs
          # from the last published version instead of resetting to 0.1.1
          # (data/ is untracked, so a fresh checkout has no manifest).
          PREV_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" | \
            jq -r --arg cur "$RELEASE_TAG" \
            '[.[] | select(.tag_name != $cur) | select(.assets | any(.name == "mappings-manifest.json"))] | .[0].tag_name // empty' \
            2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "📥 Carrying mappings-manifest.json forward from $PREV_TAG"
            gh release download "$PREV_TAG" --pattern "mappings-manifest.json" --output ./data/mappings-manifest.json --clobber || true
          fi

          echo "📋 Generating mappings manifest..."
          pnpm run manifest -- --db mappings --bump patch --changelog "Release $RELEASE_TAG" --release-tag "$RELEASE_TAG"

          MAPPINGS_VERSION=$(node -p "require('./data/mappings-manifest.json').version")
          echo "Generated Mappings Manifest Version: $MAPPINGS_VERSION"

      - name: Index and prepare Cleanroom API database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Canary, mirroring the weekly job: a Cleanroom maven outage must not
          # sink the release (npm is already published by this point) — carry
          # the previous release's cleanroom-api assets forward unchanged.
          META_URL="https://repo.cleanroommc.com/releases/com/cleanroommc/cleanroom/maven-metadata.xml"
          INDEXED=0
          if curl -sfI --max-time 30 "$META_URL" > /dev/null; then
            echo "🧬 Indexing Cleanroom API from the latest tagged sources jar..."
            pnpm run index-cleanroom-api:force
            INDEXED=1
          else
            echo "::warning::Cleanroom maven unreachable — carrying previous cleanroom-api assets forward"
          fi

          # Carry the previous manifest forward so --bump patch climbs from the
          # last published version (same rationale as the mappings step above).
          PREV_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" | \
            jq -r --arg cur "$RELEASE_TAG" \
            '[.[] | select(.tag_name != $cur) | select(.assets | any(.name == "cleanroom-api-manifest.json"))] | .[0].tag_name // empty' \
            2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "📥 Carrying cleanroom-api-manifest.json forward from $PREV_TAG"
            gh release download "$PREV_TAG" --pattern "cleanroom-api-manifest.json" --output ./data/cleanroom-api-manifest.json --clobber || true
            if [ ! -f ./data/cleanroom-api-manifest.json ] && [ "$INDEXED" = "1" ]; then
              echo "::warning::Previous cleanroom-api manifest download failed — version numbering restarts at 0.1.x"
            fi
          fi

          if [ "$INDEXED" = "1" ]; then
            echo "📋 Generating Cleanroom API manifest..."
            pnpm run manifest -- --db cleanroom-api --bump patch --changelog "Release $RELEASE_TAG" --release-tag "$RELEASE_TAG" --db-path ./data/cleanroom-api.db
          else
            # Outage path: reuse the previous release's DB + manifest verbatim.
            if [ -z "$PREV_TAG" ]; then
              echo "ERROR: Cleanroom maven is down and no previous release carries cleanroom-api assets."
              exit 1
            fi
            if [ ! -f ./data/cleanroom-api-manifest.json ]; then
              echo "ERROR: could not carry the previous cleanroom-api manifest forward (download failed)."
              exit 1
            fi
            if ! gh release download "$PREV_TAG" --pattern "cleanroom-api.db" --output ./data/cleanroom-api.db --clobber; then
              echo "ERROR: release $PREV_TAG carries the cleanroom-api manifest but the DB asset is missing — cannot carry forward."
              exit 1
            fi
          fi

          DB_HASH=$(sha256sum ./data/cleanroom-api.db | cut -d' ' -f1)
          MANIFEST_HASH=$(node -p "require('./data/cleanroom-api-manifest.json').hash")
          if [ "$DB_HASH" != "$MANIFEST_HASH" ]; then
            echo "ERROR: manifest hash does not match DB: $DB_HASH != $MANIFEST_HASH"
            exit 1
          fi
          echo "✅ Hash verified for cleanroom-api.db: $DB_HASH"

      - name: Prepare database release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          mkdir -p release-artifacts

          # Mappings and the Cleanroom API DB are always available from the
          # indexing steps above.
          cp data/mappings.db release-artifacts/
          cp data/mappings-manifest.json release-artifacts/
          cp data/cleanroom-api.db release-artifacts/
          cp data/cleanroom-api-manifest.json release-artifacts/

          # Docs and examples are carried forward from the previous release:
          # fresh docs come from the weekly job, fresh examples from
          # maintainer-run indexing. Each is optional — a missing previous
          # asset just skips that DB.
          carry_forward() {
            local DB_ID="$1" DB_FILE="$2" MANIFEST_FILE="$3"

            echo "🔍 Finding previous release with $DB_FILE asset..."
            # gh api --jq does not support --arg; pipe to jq directly.
            local PREV_TAG
            PREV_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" | \
              jq -r --arg cur "$RELEASE_TAG" --arg db "$DB_FILE" \
              '[.[] | select(.tag_name != $cur) | select(.assets | any(.name == $db))] | .[0].tag_name // empty' \
              2>/dev/null || echo "")

            if [ -z "$PREV_TAG" ]; then
              echo "⚠️  No previous release with $DB_FILE found — skipping $DB_ID."
              return 0
            fi

            echo "📥 Downloading $DB_FILE from release: $PREV_TAG"
            gh release download "$PREV_TAG" --pattern "$DB_FILE" --output "./data/$DB_FILE" --clobber
            # Carry the previous manifest forward too so --bump sees its version.
            gh release download "$PREV_TAG" --pattern "$MANIFEST_FILE" --output "./data/$MANIFEST_FILE" --clobber || true

            pnpm run manifest -- --db "$DB_ID" --changelog "Release $RELEASE_TAG" --release-tag "$RELEASE_TAG" --db-path "./data/$DB_FILE"

            # Hard verification: fail CI if the manifest hash does not match the DB
            local DB_HASH MANIFEST_HASH
            DB_HASH=$(sha256sum "./data/$DB_FILE" | cut -d' ' -f1)
            MANIFEST_HASH=$(node -p "require('./data/$MANIFEST_FILE').hash")
            if [ "$DB_HASH" != "$MANIFEST_HASH" ]; then
              echo "ERROR: manifest hash does not match DB: $DB_HASH != $MANIFEST_HASH"
              exit 1
            fi
            echo "✅ Hash verified for $DB_FILE: $DB_HASH"

            cp "./data/$DB_FILE" release-artifacts/
            cp "./data/$MANIFEST_FILE" release-artifacts/
          }

          carry_forward docs docs.db docs-manifest.json
          carry_forward examples examples.db examples-manifest.json

          # The docs DB is REQUIRED: without it, postinstall and the startup
          # auto-updater find no usable release and fresh installs get no
          # documentation. If no previous release carries docs.db (e.g. the
          # first release under this identity), build it fresh.
          if [ ! -f release-artifacts/docs.db ]; then
            echo "🏗️  No previous docs.db found — building fresh"
            pnpm run index-docs:prod
            pnpm run manifest -- --db docs --changelog "Release $RELEASE_TAG" --release-tag "$RELEASE_TAG" --db-path ./data/docs.db

            DB_HASH=$(sha256sum ./data/docs.db | cut -d' ' -f1)
            MANIFEST_HASH=$(node -p "require('./data/docs-manifest.json').hash")
            if [ "$DB_HASH" != "$MANIFEST_HASH" ]; then
              echo "ERROR: manifest hash does not match DB: $DB_HASH != $MANIFEST_HASH"
              exit 1
            fi
            echo "✅ Hash verified for fresh docs.db: $DB_HASH"

            cp ./data/docs.db release-artifacts/
            cp ./data/docs-manifest.json release-artifacts/
          fi

          # Fail closed: a release must never publish without the required docs DB.
          test -f release-artifacts/docs.db || { echo "ERROR: docs.db missing from release artifacts"; exit 1; }

          echo "📦 Release artifacts:"
          ls -lh release-artifacts/

      - name: Upload databases to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            release-artifacts/docs.db
            release-artifacts/docs-manifest.json
            release-artifacts/mappings.db
            release-artifacts/mappings-manifest.json
            release-artifacts/cleanroom-api.db
            release-artifacts/cleanroom-api-manifest.json
            release-artifacts/examples.db
            release-artifacts/examples-manifest.json
          append_body: true
          body: |

            ---

            ## 🗄️ Database Release

            | File | Description |
            |------|-------------|
            | `docs.db` | Documentation index with semantic embeddings (Cleanroom/Forge 1.12.2 target + Fabric/NeoForge reference) |
            | `docs-manifest.json` | Docs version manifest with SHA256 hash verification |
            | `mappings.db` | Minecraft class/method/field mappings database |
            | `mappings-manifest.json` | Mappings version manifest with SHA256 hash verification |
            | `cleanroom-api.db` | Cleanroom/Forge framework API symbol index: classes, events catalog, annotations catalog (optional) |
            | `cleanroom-api-manifest.json` | Cleanroom API version manifest with SHA256 hash verification (optional) |
            | `examples.db` | Curated mod examples database (optional) |
            | `examples-manifest.json` | Examples version manifest (optional) |

            **Auto-Update:** the MCP updates the docs database automatically on startup; optional databases auto-update once installed via `npx cleanroom-modding-mcp manage`.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log release summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DB_VERSION=$(node -p "try{require('./data/docs-manifest.json').version}catch(e){'N/A'}")
          MAPPINGS_VERSION=$(node -p "try{require('./data/mappings-manifest.json').version}catch(e){'N/A'}")
          CLEANROOM_API_VERSION=$(node -p "try{require('./data/cleanroom-api-manifest.json').version}catch(e){'N/A'}")
          echo "## 🎉 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package Version | \`v$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs DB Version | \`v$DB_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mappings Version | \`v$MAPPINGS_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cleanroom API Version | \`v$CLEANROOM_API_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | ✅ Published |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ✅ Created |" >> $GITHUB_STEP_SUMMARY

  # Sync prod back to dev after release (version bump only — databases are
  # release assets, not tracked files)
  sync-to-dev:
    name: Sync to Dev
    runs-on: ubuntu-latest
    needs: publish
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prod

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create sync PR to dev
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync prod to dev after release'
          title: 'chore: sync release changes back to dev'
          body: |
            ## 🔄 Post-Release Sync

            This PR syncs the release changes from `prod` back to `dev`:
            - Updated `package.json` version
            - Updated `CHANGELOG.md`

            **Auto-merge recommended** to keep branches in sync.
          branch: sync/prod-to-dev
          base: dev
          delete-branch: true
          labels: 'sync,automated'
